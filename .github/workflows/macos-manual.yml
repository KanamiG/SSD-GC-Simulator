name: macOS CI (manual)

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'GitHub-hosted macOS runner pool to try'
        required: true
        type: choice
        default: macos-15-intel
        options:
          - macos-15-intel
          - macos-15

permissions:
  contents: read

jobs:
  cpp:
    name: C++ / ${{ inputs.runner }} / ${{ matrix.build_type }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    env:
      CXX: clang++
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show toolchain
        run: |
          cmake --version
          $CXX --version
          uname -m

      - name: Configure
        run: |
          cmake -S . -B build-ci \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBUILD_TESTING=ON \
            -DSSD_BUILD_EXPERIMENTS=OFF

      - name: Build
        run: cmake --build build-ci --parallel 2

      - name: Run C++ tests
        run: ctest --test-dir build-ci --output-on-failure
